<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DM Hub — D&amp;D 5e Command Center</title>
  <meta name="description" content="Local-first, offline-capable D&D 5e Dungeon Master hub for encounter tracking, smart multi-attack & split-damage rolling, and tabletop prep.">
  <meta name="theme-color" content="#141518">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DM Hub">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <!-- Top Application Bar -->
    <header class="app-header">
      <div class="header-brand">
        <img src="./icons/favicon.svg" alt="" class="brand-mark" width="30" height="30">
        <h1 class="brand-title">DM Hub</h1>
        <span class="brand-subtitle">5e Command Center</span>
      </div>

      <div class="header-actions">
        <nav class="desktop-drawer-nav" aria-label="DM Tools">
          <button type="button" class="btn btn-ghost" id="nav-desktop-prep" data-desktop-drawer="prep">Prep</button>
          <button type="button" class="btn btn-ghost" id="nav-desktop-notes" data-desktop-drawer="notes">Notes</button>
          <button type="button" class="btn btn-ghost badge-dot" id="nav-desktop-settings" data-desktop-drawer="settings">
            <span>Settings</span>
            <span class="reminder-dot hidden" id="desktop-backup-dot" title="External backup recommended"></span>
          </button>
        </nav>

        <button type="button" class="btn" id="btn-toggle-roll-log" aria-controls="roll-log-drawer" aria-expanded="false">
          <span>Roll Log</span>
          <span class="count-pill" id="roll-log-count">0</span>
        </button>
      </div>
    </header>

    <!-- Main Responsive Workspace -->
    <main class="app-main" id="app-main">
      <!-- Optional First-Time Backup Folder Wizard Banner (Chrome/Edge Desktop) -->
      <div id="first-run-wizard-slot"></div>

      <div class="workspace-grid">
        <aside id="view-overview" class="is-mobile-visible" aria-label="Battlefield Overview"></aside>
        <section id="view-combat" class="panel-view is-mobile-active" aria-label="Encounter Hub"></section>
        <section id="view-roller" class="panel-view" aria-label="Smart Attack and Dice Resolver"></section>
        <section id="view-prep" class="panel-view" aria-label="Prep Library"></section>
        <section id="view-notes" class="panel-view" aria-label="Session Notes and Name Generator"></section>
        <section id="view-settings" class="panel-view" aria-label="House Rules and Backups"></section>
      </div>
    </main>

    <!-- Mobile / Tablet Fixed Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <button type="button" class="bottom-nav-btn is-active" id="nav-mobile-combat" data-mobile-tab="combat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>
        <span>Combat</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="nav-mobile-roller" data-mobile-tab="roller">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"/><path d="M12 22V12"/><path d="M21 7l-9 5-9-5"/></svg>
        <span>Roller</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="nav-mobile-prep" data-mobile-tab="prep">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Prep</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="nav-mobile-notes" data-mobile-tab="notes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Notes</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="nav-mobile-settings" data-mobile-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
        <span>Settings</span>
        <span class="reminder-dot hidden" id="mobile-backup-dot" title="External backup recommended"></span>
      </button>
    </nav>
  </div>

  <!-- Shared Slide-Over Drawer Backdrop -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <!-- Hideable Roll Log Slide-Over Drawer (Hidden by default) -->
  <aside class="slide-drawer" id="roll-log-drawer" aria-label="Roll Log" aria-hidden="true">
    <div class="drawer-header">
      <h2 class="drawer-title">Roll Log</h2>
      <button type="button" class="btn btn-ghost btn-icon" id="btn-close-roll-log" aria-label="Close Roll Log">&times;</button>
    </div>
    <div class="drawer-body" id="roll-log-drawer-body"></div>
  </aside>

  <!-- Desktop Utility Slide-Over Drawer (Prep, Notes, Settings) -->
  <aside class="slide-drawer" id="utility-drawer" aria-label="DM Tools Drawer" aria-hidden="true">
    <div class="drawer-header">
      <h2 class="drawer-title" id="utility-drawer-title">Prep Library</h2>
      <button type="button" class="btn btn-ghost btn-icon" id="btn-close-utility-drawer" aria-label="Close Drawer">&times;</button>
    </div>
    <div class="drawer-body" id="utility-drawer-body"></div>
  </aside>

  <!-- Modals & Toasts -->
  <div id="modal-root" class="hidden"></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Ordered Standard Scripts (No ES Module CORS issues on file://) -->
  <script defer src="./js/data/srd-data.js"></script>
  <script defer src="./js/data/name-data.js"></script>
  <script defer src="./js/core/dice-engine.js"></script>
  <script defer src="./js/core/store.js"></script>
  <script defer src="./js/core/backup-manager.js"></script>
  <script defer src="./js/ui/ui-utils.js"></script>
  <script defer src="./js/ui/overview-view.js"></script>
  <script defer src="./js/ui/encounter-view.js"></script>
  <script defer src="./js/ui/roller-view.js"></script>
  <script defer src="./js/ui/roll-log-view.js"></script>
  <script defer src="./js/ui/prep-view.js"></script>
  <script defer src="./js/ui/notes-view.js"></script>
  <script defer src="./js/ui/settings-view.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
